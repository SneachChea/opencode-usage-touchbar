name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build universal release
        run: ./scripts/release.sh

      - name: Inspect application binary
        run: |
          file "dist/Codex Usage Bar.app/Contents/MacOS/CodexUsageBar"
          lipo -archs "dist/Codex Usage Bar.app/Contents/MacOS/CodexUsageBar"
          cd dist
          shasum -a 256 -c Codex-Usage-Bar-v*.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Usage-Bar
          path: |
            dist/Codex-Usage-Bar-v*.zip
            dist/Codex-Usage-Bar-v*.zip.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          info_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          test "$version" = "$info_version"
          gh release create "$GITHUB_REF_NAME" \
            dist/Codex-Usage-Bar-v*.zip \
            dist/Codex-Usage-Bar-v*.zip.sha256 \
            --generate-notes \
            --title "Codex Usage Bar $GITHUB_REF_NAME"
